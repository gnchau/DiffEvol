[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "diffevol"
version = "0.1.0"
description = "Inferring evolutionary constraint from genotype frequency time series"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "seaborn>=0.12",
    "tqdm>=4.64",
]

[project.optional-dependencies]
gisaid = ["biopython>=1.80", "xlrd>=2.0", "openpyxl>=3.1"]

[project.scripts]
diffevol-run = "diffevol.cli:main"

[tool.setuptools]
packages = ["diffevol"]
